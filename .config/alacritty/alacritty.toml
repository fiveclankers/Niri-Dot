[general]
import = ["./colors.toml"    "~/.config/alacritty/themes/noctalia.toml",
]
live_config_reload = true
working_directory = "None"

[terminal.shell    "~/.config/alacritty/themes/noctalia.toml",
]
program = "/bin/fish"
args = ["-c", "fastfetch; exec fish"]

[window]
dynamic_padding = true
decorations = "none"
opacity = 0.84
padding.x = 20
padding.y = 16
resize_increments = true

[cursor]
style.shape = "beam"
style.blinking = "on"
vi_mode_style.shape = "block"
vi_mode_style.blinking = "off"
blink_interval = 500
blink_timeout = 0
thickness = 0.18
unfocused_hollow = true

[mouse]
hide_when_typing = true

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 6

[font]
size = 13
offset.x = 0
offset.y = 3
glyph_offset.x = 0
glyph_offset.y = 1
builtin_box_drawing = true

[font.normal]
family = "MonaspiceNe Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MonaspiceNe Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MonaspiceNe Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MonaspiceNe Nerd Font Mono"
style = "Bold Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[bell]
animation = "EaseOutExpo"
duration = 140
color = "#7FBBB3"

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[colors.cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellBackground"
background = "CellForeground"

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
